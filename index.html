<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тефтер</title>
<meta name="description" content="Личен тракер за разходи с бюджет по цикъл на заплата.">
<meta name="theme-color" content="#F7F1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="dark light">

<!-- iOS: makes Add to Home Screen open chrome-less, full screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тефтер">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #1C1C1C;
    --surface: #242323;
    --surface-alt: #2E2C2C;
    --ink: #F3F0F0;
    --ink-soft: #A79FA0;
    --ink-faint: #6E6667;
    --border: #363333;
    --accent: #B5023E;
    --accent-soft: #3B0E1E;
    --accent-deep: #6B0128;
    --accent-ink: #FF7FA1;
    --warn: #D98F2B;
    --warn-soft: #3A2810;
    --radius: 18px;
    --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.55);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F7F1F2;
      --surface: #FFFFFF;
      --surface-alt: #F1E7E9;
      --ink: #1C1C1C;
      --ink-soft: #635A5C;
      --ink-faint: #988F91;
      --border: #E6DADD;
      --accent: #B5023E;
      --accent-soft: #FCE1E9;
      --accent-deep: #8A0230;
      --accent-ink: #8A0230;
      --warn: #B5652A;
      --warn-soft: #F5E6D3;
      --sheet-shadow: 0 -8px 32px rgba(20, 10, 12, 0.18);
    }
  }
  :root[data-theme="light"] {
    --bg: #F7F1F2;
    --surface: #FFFFFF;
    --surface-alt: #F1E7E9;
    --ink: #1C1C1C;
    --ink-soft: #635A5C;
    --ink-faint: #988F91;
    --border: #E6DADD;
    --accent: #B5023E;
    --accent-soft: #FCE1E9;
    --accent-deep: #8A0230;
    --accent-ink: #8A0230;
    --warn: #B5652A;
    --warn-soft: #F5E6D3;
    --sheet-shadow: 0 -8px 32px rgba(20, 10, 12, 0.18);
  }

  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: var(--app-height, 100vh);
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .nums { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3, .display { font-family: "Manrope", -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }

  header.top {
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header.top .brand { font-family: "Manrope", sans-serif; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
  header.top .month-switch {
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }
  header.top .month-switch button {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  header.top .month-switch button:active { color: var(--accent); }
  header.top .month-label { min-width: 64px; text-align: center; text-transform: capitalize; font-size: 0.76rem; padding: 0 2px; }
  header.top #paydayBtn { margin-left: 2px; padding: 4px; color: var(--ink-faint); }

  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 20px 90px;
    -webkit-overflow-scrolling: touch;
  }

  .view { display: none; flex-direction: column; gap: 22px; }
  .view.active { display: flex; }

  /* ---- Home ---- */
  .hero {
    background: linear-gradient(155deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: #FBEEF1;
    border-radius: 22px;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    right: -30px;
    top: -30px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; opacity: 0.75; }
  .hero .amount { font-size: 2.5rem; font-weight: 600; }
  .hero .sub { font-size: 0.85rem; opacity: 0.85; }
  .hero .sub b { font-weight: 600; }

  /* ---- Daily budget ---- */
  .daily-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .daily-card .top { display: flex; align-items: baseline; justify-content: space-between; }
  .daily-card .amount { font-size: 1.9rem; font-weight: 600; }
  .daily-card .amount.warn { color: var(--warn); }
  .daily-card .caption { font-size: 0.78rem; color: var(--ink-faint); }
  .daily-card .breakdown {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.83rem;
  }
  .daily-card .breakdown .row { display: flex; justify-content: space-between; color: var(--ink-soft); }
  .daily-card .breakdown .row b { color: var(--ink); font-weight: 500; }
  .daily-card .breakdown .row.total b { color: var(--accent); }
  .daily-card .breakdown .row.total.warn b { color: var(--warn); }
  .daily-card .setup-btn {
    align-self: flex-start;
    border: none;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-size: 0.82rem;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
  }

  .oblig-labels { display: flex; gap: 8px; padding: 0 2px; }
  .oblig-labels span { font-size: 0.68rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .oblig-labels span.oblig-label-name { flex: 1; }
  .oblig-labels span.oblig-label-amt { width: 100px; flex: none; }
  .oblig-labels span.oblig-label-spacer { width: 34px; flex: none; }
  .oblig-row { display: flex; gap: 8px; align-items: center; }
  .oblig-row input { flex: 1; }
  .oblig-row input.oblig-amt { max-width: 100px; flex: none; text-align: right; }
  .oblig-row .oblig-del {
    border: none; background: var(--surface-alt); color: var(--ink-faint);
    width: 34px; height: 34px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
  }
  .add-row-btn {
    border: 1.5px dashed var(--border);
    background: none;
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .oblig-total {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--ink-soft);
    padding-top: 4px;
  }
  .oblig-total b { color: var(--ink); }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-tile .label { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-tile .value { font-size: 1.25rem; font-weight: 600; }
  .stat-tile .value.warn { color: var(--warn); }

  section.block { display: flex; flex-direction: column; gap: 10px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; }
  .block-head h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .block-head .link { font-size: 0.8rem; color: var(--accent); cursor: pointer; }

  .budget-bars { display: flex; flex-direction: column; gap: 12px; }
  .budget-bar { display: flex; flex-direction: column; gap: 5px; }
  .budget-bar .row { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .budget-bar .row .cat { display: flex; align-items: center; gap: 7px; font-weight: 500; }
  .budget-bar .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .budget-bar .amt { color: var(--ink-soft); }
  .budget-bar .track { height: 7px; border-radius: 4px; background: var(--surface-alt); overflow: hidden; }
  .budget-bar .fill { height: 100%; border-radius: 4px; }

  /* ---- Lists ---- */
  .day-group { display: flex; flex-direction: column; gap: 8px; }
  .day-group .day-label { font-size: 0.75rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
  .expense-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .expense-row .icon-dot {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; flex-shrink: 0;
  }
  .expense-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .expense-row .cat-name { font-weight: 500; font-size: 0.92rem; }
  .expense-row .note { font-size: 0.78rem; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .expense-row .amount { font-weight: 600; font-size: 0.95rem; flex-shrink: 0; }
  .empty-state { text-align: center; padding: 40px 12px; color: var(--ink-faint); display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .empty-state .display { font-size: 1.1rem; color: var(--ink-soft); }

  /* ---- Categories ---- */
  .cat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cat-card .top-row { display: flex; align-items: center; gap: 10px; }
  .cat-card .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .cat-card .name { font-weight: 600; flex: 1; }
  .cat-card .edit-btn { border: none; background: var(--surface-alt); color: var(--ink-soft); font-size: 0.75rem; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .cat-card .budget-line { font-size: 0.82rem; color: var(--ink-soft); display: flex; justify-content: space-between; }
  .cat-card .track { height: 6px; border-radius: 3px; background: var(--surface-alt); overflow: hidden; }
  .cat-card .fill { height: 100%; border-radius: 3px; }
  .add-cat-btn {
    border: 1.5px dashed var(--border);
    background: none;
    color: var(--ink-soft);
    border-radius: var(--radius);
    padding: 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  /* ---- Nav ---- */
  nav.tabbar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
    gap: 4px;
    flex-shrink: 0;
  }
  nav.tabbar button {
    flex: 1;
    border: none;
    background: none;
    color: var(--ink-faint);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 0.68rem;
    font-family: inherit;
    padding: 6px 4px;
    cursor: pointer;
    border-radius: 10px;
  }
  nav.tabbar button svg { width: 21px; height: 21px; }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar button.active svg { filter: none; }

  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 1.7rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(15,60,45,0.32);
    cursor: pointer;
    z-index: 5;
  }
  .fab:active { transform: scale(0.94); }

  /* ---- Sheet / modal ---- */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,18,14,0.42);
    display: flex; align-items: flex-end;
    z-index: 20;
  }
  .sheet {
    background: var(--surface);
    width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    box-shadow: var(--sheet-shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto; }
  .sheet h3 { margin: 0; font-size: 1.15rem; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.78rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select, .field textarea {
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 1rem;
    font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .amount-input { font-family: "IBM Plex Mono", monospace; font-size: 1.5rem; font-weight: 600; }
  .cat-pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-pick .chip {
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    padding: 8px 13px;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .cat-pick .chip.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 13px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: 0.5; }
  .btn.ghost { background: var(--surface-alt); color: var(--ink-soft); }
  .btn.danger { background: var(--warn-soft); color: var(--warn); }

  [hidden] { display: none !important; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Тефтер</div>
  <div class="month-switch">
    <button id="prevMonth" aria-label="Предишен период">‹</button>
    <span class="month-label nums" id="monthLabel">—</span>
    <button id="nextMonth" aria-label="Следващ период">›</button>
    <button id="paydayBtn" aria-label="Настройки на периода">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="17" height="17"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="hero">
      <div class="eyebrow">Общо похарчено</div>
      <div class="amount nums" id="homeTotal">0.00 €</div>
      <div class="sub" id="homeSub">Зареждане…</div>
    </div>

    <section class="block">
      <div class="block-head">
        <h2>Разполагаем бюджет на ден</h2>
        <span class="link" id="editBudgetLink">Настрой</span>
      </div>
      <div class="daily-card" id="dailyBudgetCard"></div>
    </section>

    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">Дневен ср.</div>
        <div class="value nums" id="statDaily">0.00 €</div>
      </div>
      <div class="stat-tile">
        <div class="label">Разходи</div>
        <div class="value nums" id="statCount">0</div>
      </div>
    </div>

    <section class="block">
      <div class="block-head">
        <h2>Бюджети по категории</h2>
        <span class="link" data-goto="categories">Виж всички</span>
      </div>
      <div class="budget-bars" id="homeBudgets"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Последни разходи</h2>
        <span class="link" data-goto="expenses">Виж всички</span>
      </div>
      <div id="homeRecent"></div>
    </section>
  </section>

  <!-- EXPENSES -->
  <section class="view" id="view-expenses">
    <section class="block">
      <div class="block-head">
        <h2>Разходи този месец</h2>
        <span class="link nums" id="expensesTotal"></span>
      </div>
      <div id="expensesList"></div>
    </section>
  </section>

  <!-- STATS -->
  <section class="view" id="view-stats">
    <section class="block">
      <h2>Разпределение по категории</h2>
      <div id="statsChart" style="display:flex; flex-direction:column; gap:14px;"></div>
    </section>
    <section class="block">
      <h2>По месеци</h2>
      <div id="statsTrend"></div>
    </section>
  </section>

  <!-- CATEGORIES -->
  <section class="view" id="view-categories">
    <section class="block" id="categoriesList"></section>
    <button class="add-cat-btn" id="addCatBtn">+ Нова категория</button>
  </section>
</main>

<button class="fab" id="fabAdd" aria-label="Добави разход">+</button>

<nav class="tabbar">
  <button class="tab-btn active" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    Начало
  </button>
  <button class="tab-btn" data-view="expenses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
    Разходи
  </button>
  <button class="tab-btn" data-view="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    Стат.
  </button>
  <button class="tab-btn" data-view="categories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Категории
  </button>
</nav>

<div id="sheetRoot"></div>

<script>
(function () {
  "use strict";

  // iOS standalone mode misreports 100dvh/100vh; measure the real visible height in JS instead.
  function setAppHeight() {
    document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", function () { setTimeout(setAppHeight, 150); });

  var MONTHS =["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
  var DAYS = ["нед","пон","вт","ср","чет","пет","съб"];
  var DEFAULT_CATEGORIES = [
    { name: "Храна", color: "#1F6F5C", budget: 400 },
    { name: "Транспорт", color: "#B9852B", budget: 100 },
    { name: "Дом", color: "#5B6FA8", budget: 300 },
    { name: "Забавления", color: "#B25A9E", budget: 100 },
    { name: "Здраве", color: "#AD3B31", budget: 80 },
    { name: "Други", color: "#6B7C72", budget: 100 }
  ];

  // ---------- Local storage layer ----------
  var LS = {
    expenses: "ledger.expenses",
    categories: "ledger.categories",
    budgets: "ledger.budgets",
    settings: "ledger.settings"
  };
  function loadLS(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function saveLS(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

  var state = {
    expenses: [],
    categories: [],
    budgets: {},
    payday: 1,
    periodStart: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    budget: { income: 0, obligations: [] }
  };

  function fmt(n) {
    return (Math.round(n * 100) / 100).toFixed(2).replace(".", ",") + " €";
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return isoDate(new Date()); }

  // ---------- Pay-cycle periods (e.g. 20th to 20th) ----------
  function clampDay(y, m, day) {
    var last = new Date(y, m + 1, 0).getDate();
    return Math.min(day, last);
  }
  function periodStartForDate(d, payday) {
    var y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    var startDay = clampDay(y, m, payday);
    if (day >= startDay) return new Date(y, m, startDay);
    var pm = m - 1, py = y;
    if (pm < 0) { pm = 11; py -= 1; }
    return new Date(py, pm, clampDay(py, pm, payday));
  }
  function periodEndExclusive(start, payday) {
    var y = start.getFullYear(), m = start.getMonth();
    var ny = m === 11 ? y + 1 : y, nm = (m + 1) % 12;
    return new Date(ny, nm, clampDay(ny, nm, payday));
  }
  function periodKey(d) { return isoDate(d); }
  function formatPeriodLabel(start, payday) {
    if (payday === 1) return MONTHS[start.getMonth()] + " " + start.getFullYear();
    var end = new Date(periodEndExclusive(start, payday).getTime() - 86400000);
    var sameYear = start.getFullYear() === end.getFullYear();
    var s = start.getDate() + " " + MONTHS[start.getMonth()].slice(0, 3) + ".";
    var e = end.getDate() + " " + MONTHS[end.getMonth()].slice(0, 3) + "." + (sameYear ? "" : " " + end.getFullYear());
    return s + " – " + e;
  }
  function loadBudgetForPeriod() {
    state.budget = state.budgets[periodKey(state.periodStart)] || { income: 0, obligations: [] };
  }

  function catById(id) {
    for (var i = 0; i < state.categories.length; i++) if (state.categories[i].id === id) return state.categories[i];
    return null;
  }

  // ---------- Views / nav ----------
  function showView(name) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.getElementById("view-" + name).classList.add("active");
    document.querySelectorAll(".tab-btn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === name);
    });
  }
  document.querySelectorAll(".tab-btn").forEach(function (b) {
    b.addEventListener("click", function () { showView(b.dataset.view); });
  });
  document.querySelectorAll("[data-goto]").forEach(function (el) {
    el.addEventListener("click", function () { showView(el.dataset.goto); });
  });

  document.getElementById("prevMonth").addEventListener("click", function () {
    state.periodStart = periodStartForDate(new Date(state.periodStart.getTime() - 86400000), state.payday);
    loadBudgetForPeriod();
    render();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    state.periodStart = periodEndExclusive(state.periodStart, state.payday);
    loadBudgetForPeriod();
    render();
  });

  // ---------- Derived data ----------
  function monthExpenses() {
    var startISO = isoDate(state.periodStart);
    var endISO = isoDate(periodEndExclusive(state.periodStart, state.payday));
    return state.expenses.filter(function (e) { return e.date && e.date >= startISO && e.date < endISO; })
      .sort(function (a, b) { return b.date.localeCompare(a.date) || b.createdAt - a.createdAt; });
  }

  function groupByDay(list) {
    var groups = [];
    var map = {};
    list.forEach(function (e) {
      if (!map[e.date]) {
        map[e.date] = { date: e.date, items: [], total: 0 };
        groups.push(map[e.date]);
      }
      map[e.date].items.push(e);
      map[e.date].total += e.amount;
    });
    return groups;
  }

  function dayLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((today - d) / 86400000);
    if (diff === 0) return "Днес";
    if (diff === 1) return "Вчера";
    return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + ".";
  }

  // ---------- Rendering ----------
  function render() {
    document.getElementById("monthLabel").textContent = formatPeriodLabel(state.periodStart, state.payday);

    var list = monthExpenses();
    var total = list.reduce(function (s, e) { return s + e.amount; }, 0);
    var budgetTotal = state.categories.reduce(function (s, c) { return s + (c.budget || 0); }, 0);

    document.getElementById("homeTotal").textContent = fmt(total);
    var sub = document.getElementById("homeSub");
    if (budgetTotal > 0) {
      var pct = Math.round((total / budgetTotal) * 100);
      sub.innerHTML = "от бюджет <b>" + fmt(budgetTotal) + "</b> · " + pct + "%";
    } else {
      sub.textContent = list.length ? list.length + " записа този период" : "Няма разходи още";
    }

    var periodEnd = periodEndExclusive(state.periodStart, state.payday);
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var daysInPeriod = Math.round((periodEnd - state.periodStart) / 86400000);
    var daysSoFar = now < state.periodStart ? daysInPeriod :
      (now >= periodEnd ? daysInPeriod : Math.round((now - state.periodStart) / 86400000) + 1);
    document.getElementById("statDaily").textContent = fmt(list.length ? total / daysSoFar : 0);
    document.getElementById("statCount").textContent = String(list.length);

    renderDailyBudget(total);
    renderBudgetBars(list);
    renderRecent(list);
    renderExpensesList(list, total);
    renderCategories();
    renderStats(list);
  }

  function renderDailyBudget(spentThisPeriod) {
    var el = document.getElementById("dailyBudgetCard");
    var income = state.budget.income || 0;
    var obligations = state.budget.obligations || [];
    var reserved = obligations.reduce(function (s, o) { return s + (o.amount || 0); }, 0);

    if (!income && !reserved) {
      el.innerHTML =
        '<div class="caption">Добави заплатата си и задължителните разходи (наем, сметки и т.н.), за да виждаш колко можеш да харчиш на ден.</div>' +
        '<button class="setup-btn" id="setupBudgetBtn">Настрой бюджет</button>';
      var btn = document.getElementById("setupBudgetBtn");
      if (btn) btn.addEventListener("click", openBudgetSheet);
      return;
    }

    var freeToSpend = income - reserved;
    var leftNow = freeToSpend - spentThisPeriod;

    var periodEnd = periodEndExclusive(state.periodStart, state.payday);
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var isCurrent = now >= state.periodStart && now < periodEnd;
    var daysRemaining = isCurrent ? Math.max(1, Math.round((periodEnd - now) / 86400000)) : Math.round((periodEnd - state.periodStart) / 86400000);
    var daily = leftNow / daysRemaining;
    var warn = daily < 0;

    el.innerHTML =
      '<div class="top"><div>' +
        '<div class="amount nums' + (warn ? " warn" : "") + '">' + fmt(daily) + '</div>' +
        '<div class="caption">на ден' + (isCurrent ? " · остават " + daysRemaining + " дни" : "") + '</div>' +
      '</div></div>' +
      '<div class="breakdown">' +
        '<div class="row"><span>Заплата</span><b class="nums">' + fmt(income) + '</b></div>' +
        '<div class="row"><span>Заделено (наем, сметки…)</span><b class="nums">' + fmt(reserved) + '</b></div>' +
        '<div class="row"><span>За харчене общо</span><b class="nums">' + fmt(freeToSpend) + '</b></div>' +
        '<div class="row"><span>Похарчено до момента</span><b class="nums">' + fmt(spentThisPeriod) + '</b></div>' +
        '<div class="row total' + (warn ? " warn" : "") + '"><span>Остатък</span><b class="nums">' + fmt(leftNow) + '</b></div>' +
      '</div>';
  }

  function spentByCategory(list) {
    var map = {};
    list.forEach(function (e) { map[e.categoryId] = (map[e.categoryId] || 0) + e.amount; });
    return map;
  }

  function renderBudgetBars(list) {
    var spent = spentByCategory(list);
    var el = document.getElementById("homeBudgets");
    if (!state.categories.length) { el.innerHTML = '<div class="empty-state">Все още няма категории</div>'; return; }
    el.innerHTML = state.categories.map(function (c) {
      var s = spent[c.id] || 0;
      var pct = c.budget > 0 ? Math.min(100, (s / c.budget) * 100) : (s > 0 ? 100 : 0);
      var over = c.budget > 0 && s > c.budget;
      return '<div class="budget-bar">' +
        '<div class="row"><span class="cat"><span class="dot" style="background:' + c.color + '"></span>' + escapeHtml(c.name) + '</span>' +
        '<span class="amt">' + fmt(s) + (c.budget > 0 ? ' / ' + fmt(c.budget) : '') + '</span></div>' +
        '<div class="track"><div class="fill" style="width:' + pct + '%; background:' + (over ? "var(--warn)" : c.color) + '"></div></div>' +
        '</div>';
    }).join("");
  }

  function expenseRowHtml(e) {
    var c = catById(e.categoryId);
    var color = c ? c.color : "#8B9A91";
    var name = c ? c.name : "Без категория";
    return '<div class="expense-row" data-id="' + e.id + '">' +
      '<div class="icon-dot" style="background:' + hexToSoft(color) + '; color:' + color + '">' + (name[0] || "?").toUpperCase() + '</div>' +
      '<div class="info"><div class="cat-name">' + escapeHtml(name) + '</div>' +
      (e.note ? '<div class="note">' + escapeHtml(e.note) + '</div>' : '') + '</div>' +
      '<div class="amount nums">' + fmt(e.amount) + '</div>' +
      '</div>';
  }

  function renderRecent(list) {
    var el = document.getElementById("homeRecent");
    if (!list.length) { el.innerHTML = '<div class="empty-state"><div class="display">Все още тихо тук</div>Добави първия си разход с бутона +</div>'; return; }
    el.innerHTML = '<div class="day-group">' + list.slice(0, 5).map(expenseRowHtml).join("") + '</div>';
    bindRowClicks(el);
  }

  function renderExpensesList(list, total) {
    document.getElementById("expensesTotal").textContent = fmt(total);
    var el = document.getElementById("expensesList");
    if (!list.length) { el.innerHTML = '<div class="empty-state"><div class="display">Няма разходи</div>За избрания месец</div>'; return; }
    var groups = groupByDay(list);
    el.innerHTML = groups.map(function (g) {
      return '<div class="day-group"><div class="day-label">' + dayLabel(g.date) + ' · ' + fmt(g.total) + '</div>' +
        g.items.map(expenseRowHtml).join("") + '</div>';
    }).join("");
    bindRowClicks(el);
  }

  function bindRowClicks(container) {
    container.querySelectorAll(".expense-row").forEach(function (row) {
      row.addEventListener("click", function () {
        var e = state.expenses.find(function (x) { return x.id === row.dataset.id; });
        if (e) openExpenseSheet(e);
      });
    });
  }

  function renderCategories() {
    var el = document.getElementById("categoriesList");
    var list = monthExpenses();
    var spent = spentByCategory(list);
    if (!state.categories.length) { el.innerHTML = '<div class="empty-state">Добави първата си категория</div>'; return; }
    el.innerHTML = state.categories.map(function (c) {
      var s = spent[c.id] || 0;
      var pct = c.budget > 0 ? Math.min(100, (s / c.budget) * 100) : 0;
      var over = c.budget > 0 && s > c.budget;
      return '<div class="cat-card" data-id="' + c.id + '">' +
        '<div class="top-row"><span class="dot" style="background:' + c.color + '"></span>' +
        '<span class="name">' + escapeHtml(c.name) + '</span>' +
        '<button class="edit-btn" data-edit="' + c.id + '">Редактирай</button></div>' +
        (c.budget > 0 ? '<div class="budget-line"><span>' + fmt(s) + ' от ' + fmt(c.budget) + '</span><span style="color:' + (over ? "var(--warn)" : "var(--ink-faint)") + '">' + Math.round(pct) + '%</span></div>' +
        '<div class="track"><div class="fill" style="width:' + pct + '%; background:' + (over ? "var(--warn)" : c.color) + '"></div></div>' : '<div class="budget-line"><span>' + fmt(s) + ' похарчени</span><span>без бюджет</span></div>') +
        '</div>';
    }).join("");
    el.querySelectorAll("[data-edit]").forEach(function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        openCategorySheet(catById(b.dataset.edit));
      });
    });
  }

  function renderStats(list) {
    var spent = spentByCategory(list);
    var total = list.reduce(function (s, e) { return s + e.amount; }, 0);
    var chartEl = document.getElementById("statsChart");
    var withSpend = state.categories.filter(function (c) { return (spent[c.id] || 0) > 0; })
      .sort(function (a, b) { return (spent[b.id] || 0) - (spent[a.id] || 0); });
    if (!withSpend.length) {
      chartEl.innerHTML = '<div class="empty-state">Няма данни за този месец</div>';
    } else {
      chartEl.innerHTML = withSpend.map(function (c) {
        var s = spent[c.id] || 0;
        var pct = total > 0 ? Math.round((s / total) * 100) : 0;
        return '<div class="budget-bar">' +
          '<div class="row"><span class="cat"><span class="dot" style="background:' + c.color + '"></span>' + escapeHtml(c.name) + '</span>' +
          '<span class="amt">' + fmt(s) + ' · ' + pct + '%</span></div>' +
          '<div class="track"><div class="fill" style="width:' + pct + '%; background:' + c.color + '"></div></div>' +
          '</div>';
      }).join("");
    }

    var trendEl = document.getElementById("statsTrend");
    var periods = [state.periodStart];
    var p = state.periodStart;
    for (var i = 0; i < 5; i++) {
      p = periodStartForDate(new Date(p.getTime() - 86400000), state.payday);
      periods.unshift(p);
    }
    var sums = periods.map(function (pStart) {
      var sISO = isoDate(pStart), eISO = isoDate(periodEndExclusive(pStart, state.payday));
      return state.expenses.filter(function (e) { return e.date && e.date >= sISO && e.date < eISO; })
        .reduce(function (s, e) { return s + e.amount; }, 0);
    });
    var max = Math.max.apply(null, sums.concat([1]));
    trendEl.innerHTML = '<div style="display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:8px;">' +
      periods.map(function (pStart, i) {
        var h = Math.max(4, Math.round((sums[i] / max) * 96));
        var isCursor = periodKey(pStart) === periodKey(state.periodStart);
        var label = state.payday === 1 ? MONTHS[pStart.getMonth()].slice(0, 3) : pStart.getDate() + " " + MONTHS[pStart.getMonth()].slice(0, 3);
        return '<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">' +
          '<div class="nums" style="font-size:0.65rem; color:var(--ink-faint);">' + (sums[i] > 0 ? Math.round(sums[i]) : "") + '</div>' +
          '<div style="width:100%; max-width:28px; height:' + h + 'px; border-radius:6px 6px 2px 2px; background:' + (isCursor ? "var(--accent)" : "var(--surface-alt)") + ';"></div>' +
          '<div style="font-size:0.65rem; color:var(--ink-faint);">' + label + '</div>' +
          '</div>';
      }).join("") + '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hexToSoft(hex) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return "rgba(" + r + "," + g + "," + b + ",0.16)";
  }

  // ---------- Data mutations ----------
  function addExpense(data) {
    data.id = uid();
    state.expenses.push(data);
    saveLS(LS.expenses, state.expenses);
    render();
  }
  function updateExpense(id, data) {
    var i = state.expenses.findIndex(function (e) { return e.id === id; });
    if (i === -1) return;
    data.id = id;
    state.expenses[i] = data;
    saveLS(LS.expenses, state.expenses);
    render();
  }
  function deleteExpense(id) {
    state.expenses = state.expenses.filter(function (e) { return e.id !== id; });
    saveLS(LS.expenses, state.expenses);
    render();
  }
  function addCategory(data) {
    data.id = uid();
    state.categories.push(data);
    saveLS(LS.categories, state.categories);
    render();
  }
  function updateCategory(id, data) {
    var i = state.categories.findIndex(function (c) { return c.id === id; });
    if (i === -1) return;
    data.id = id;
    state.categories[i] = data;
    saveLS(LS.categories, state.categories);
    render();
  }
  function deleteCategory(id) {
    state.categories = state.categories.filter(function (c) { return c.id !== id; });
    saveLS(LS.categories, state.categories);
    render();
  }
  function saveBudgetForCurrentPeriod(data) {
    state.budgets[periodKey(state.periodStart)] = data;
    saveLS(LS.budgets, state.budgets);
    state.budget = data;
    render();
  }
  function savePayday(day) {
    state.payday = day;
    saveLS(LS.settings, { payday: day });
    state.periodStart = periodStartForDate(new Date(), day);
    loadBudgetForPeriod();
    render();
  }
  function deleteExpensesInCurrentPeriod() {
    var startISO = isoDate(state.periodStart);
    var endISO = isoDate(periodEndExclusive(state.periodStart, state.payday));
    state.expenses = state.expenses.filter(function (e) { return !(e.date && e.date >= startISO && e.date < endISO); });
    saveLS(LS.expenses, state.expenses);
    render();
  }

  // ---------- Sheets ----------
  var sheetRoot = document.getElementById("sheetRoot");
  function closeSheet() { sheetRoot.innerHTML = ""; }

  function openExpenseSheet(existing) {
    if (!state.categories.length) { openCategorySheet(null); return; }
    var isEdit = !!existing;
    var backdrop = document.createElement("div");
    backdrop.className = "sheet-backdrop";
    backdrop.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-handle"></div>' +
        '<h3>' + (isEdit ? "Редактирай разход" : "Нов разход") + '</h3>' +
        '<div class="field"><label>Сума</label><input class="amount-input" id="f-amount" inputmode="decimal" placeholder="0.00" value="' + (isEdit ? existing.amount : "") + '"></div>' +
        '<div class="field"><label>Категория</label><div class="cat-pick" id="f-cats">' +
          state.categories.map(function (c) {
            var sel = isEdit && existing.categoryId === c.id;
            return '<div class="chip' + (sel ? " selected" : "") + '" data-cat="' + c.id + '"><span class="dot" style="background:' + c.color + '"></span>' + escapeHtml(c.name) + '</div>';
          }).join("") + '</div></div>' +
        '<div class="field"><label>Дата</label><input type="date" id="f-date" value="' + (isEdit ? existing.date : todayISO()) + '"></div>' +
        '<div class="field"><label>Бележка (по избор)</label><input id="f-note" placeholder="напр. обяд с колеги" value="' + (isEdit ? escapeHtml(existing.note || "") : "") + '"></div>' +
        '<div class="sheet-actions">' +
          (isEdit ? '<button class="btn danger" id="f-delete">Изтрий</button>' : '<button class="btn ghost" id="f-cancel">Отказ</button>') +
          '<button class="btn primary" id="f-save">Запази</button>' +
        '</div>' +
      '</div>';
    sheetRoot.appendChild(backdrop);

    var selectedCat = isEdit ? existing.categoryId : null;
    backdrop.querySelectorAll("[data-cat]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        backdrop.querySelectorAll("[data-cat]").forEach(function (c) { c.classList.remove("selected"); });
        chip.classList.add("selected");
        selectedCat = chip.dataset.cat;
      });
    });
    backdrop.addEventListener("click", function (ev) { if (ev.target === backdrop) closeSheet(); });
    var cancelBtn = backdrop.querySelector("#f-cancel");
    if (cancelBtn) cancelBtn.addEventListener("click", closeSheet);
    var delBtn = backdrop.querySelector("#f-delete");
    if (delBtn) delBtn.addEventListener("click", function () {
      deleteExpense(existing.id);
      closeSheet();
    });
    backdrop.querySelector("#f-save").addEventListener("click", function () {
      var amount = parseFloat(String(document.getElementById("f-amount").value).replace(",", "."));
      var date = document.getElementById("f-date").value || todayISO();
      var note = document.getElementById("f-note").value.trim();
      if (!amount || amount <= 0 || !selectedCat) return;
      var data = { amount: amount, categoryId: selectedCat, date: date, note: note };
      if (isEdit) {
        data.createdAt = existing.createdAt;
        updateExpense(existing.id, data);
      } else {
        data.createdAt = Date.now();
        addExpense(data);
      }
      closeSheet();
    });
  }

  function openCategorySheet(existing) {
    var isEdit = !!existing;
    var backdrop = document.createElement("div");
    backdrop.className = "sheet-backdrop";
    var palette = ["#1F6F5C","#B9852B","#5B6FA8","#B25A9E","#AD3B31","#6B7C72","#3F7FA6","#8A6D3B"];
    backdrop.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-handle"></div>' +
        '<h3>' + (isEdit ? "Редактирай категория" : "Нова категория") + '</h3>' +
        '<div class="field"><label>Име</label><input id="c-name" placeholder="напр. Храна" value="' + (isEdit ? escapeHtml(existing.name) : "") + '"></div>' +
        '<div class="field"><label>Месечен бюджет (по избор)</label><input class="amount-input" id="c-budget" inputmode="decimal" placeholder="0.00" value="' + (isEdit && existing.budget ? existing.budget : "") + '"></div>' +
        '<div class="field"><label>Цвят</label><div class="cat-pick" id="c-colors">' +
          palette.map(function (col) {
            var sel = isEdit ? existing.color === col : col === palette[0];
            return '<div class="chip' + (sel ? " selected" : "") + '" data-color="' + col + '" style="padding:10px;"><span class="dot" style="background:' + col + '; width:16px; height:16px;"></span></div>';
          }).join("") + '</div></div>' +
        '<div class="sheet-actions">' +
          (isEdit ? '<button class="btn danger" id="c-delete">Изтрий</button>' : '<button class="btn ghost" id="c-cancel">Отказ</button>') +
          '<button class="btn primary" id="c-save">Запази</button>' +
        '</div>' +
      '</div>';
    sheetRoot.appendChild(backdrop);

    var selectedColor = isEdit ? existing.color : palette[0];
    backdrop.querySelectorAll("[data-color]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        backdrop.querySelectorAll("[data-color]").forEach(function (c) { c.classList.remove("selected"); });
        chip.classList.add("selected");
        selectedColor = chip.dataset.color;
      });
    });
    backdrop.addEventListener("click", function (ev) { if (ev.target === backdrop) closeSheet(); });
    var cancelBtn = backdrop.querySelector("#c-cancel");
    if (cancelBtn) cancelBtn.addEventListener("click", closeSheet);
    var delBtn = backdrop.querySelector("#c-delete");
    if (delBtn) delBtn.addEventListener("click", function () {
      deleteCategory(existing.id);
      closeSheet();
    });
    backdrop.querySelector("#c-save").addEventListener("click", function () {
      var name = document.getElementById("c-name").value.trim();
      var budget = parseFloat(String(document.getElementById("c-budget").value).replace(",", ".")) || 0;
      if (!name) return;
      var data = { name: name, budget: budget, color: selectedColor };
      if (isEdit) {
        data.order = existing.order;
        updateCategory(existing.id, data);
      } else {
        data.order = state.categories.length;
        addCategory(data);
      }
      closeSheet();
    });
  }

  function openBudgetSheet() {
    var backdrop = document.createElement("div");
    backdrop.className = "sheet-backdrop";
    var obligations = (state.budget.obligations || []).map(function (o) { return { name: o.name, amount: o.amount }; });
    if (!obligations.length) obligations.push({ name: "", amount: "" });

    backdrop.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-handle"></div>' +
        '<h3>Бюджет за ' + formatPeriodLabel(state.periodStart, state.payday) + '</h3>' +
        '<div class="field"><label>Заплата / приход</label><input class="amount-input" id="b-income" inputmode="decimal" placeholder="0.00" value="' + (state.budget.income || "") + '"></div>' +
        '<div class="field"><label>Задължителни разходи (наем, сметки…)</label>' +
          '<div class="oblig-labels"><span class="oblig-label-name">Име</span><span class="oblig-label-amt">Сума €</span><span class="oblig-label-spacer"></span></div>' +
          '<div id="b-oblig-rows" style="display:flex; flex-direction:column; gap:8px;"></div>' +
          '<button type="button" class="add-row-btn" id="b-add-row">+ Добави ред</button>' +
          '<div class="oblig-total"><span>Общо заделено</span><b class="nums" id="b-oblig-total">0,00 €</b></div>' +
        '</div>' +
        '<div class="sheet-actions">' +
          '<button class="btn ghost" id="b-cancel">Отказ</button>' +
          '<button class="btn primary" id="b-save">Запази</button>' +
        '</div>' +
      '</div>';
    sheetRoot.appendChild(backdrop);

    var rowsEl = backdrop.querySelector("#b-oblig-rows");

    function renderRows() {
      rowsEl.innerHTML = obligations.map(function (o, i) {
        return '<div class="oblig-row" data-i="' + i + '">' +
          '<input placeholder="напр. Наем" class="oblig-name" value="' + escapeHtml(o.name || "") + '">' +
          '<input class="amount-input oblig-amt" inputmode="decimal" placeholder="0.00" value="' + (o.amount || o.amount === 0 ? o.amount : "") + '">' +
          '<button type="button" class="oblig-del" aria-label="Изтрий">×</button>' +
          '</div>';
      }).join("");
      rowsEl.querySelectorAll(".oblig-row").forEach(function (row) {
        var i = parseInt(row.dataset.i, 10);
        row.querySelector(".oblig-name").addEventListener("input", function (e) { obligations[i].name = e.target.value; });
        row.querySelector(".oblig-amt").addEventListener("input", function (e) {
          obligations[i].amount = parseFloat(String(e.target.value).replace(",", ".")) || 0;
          updateTotal();
        });
        row.querySelector(".oblig-del").addEventListener("click", function () {
          obligations.splice(i, 1);
          if (!obligations.length) obligations.push({ name: "", amount: "" });
          renderRows();
          updateTotal();
        });
      });
    }
    function updateTotal() {
      var total = obligations.reduce(function (s, o) { return s + (parseFloat(o.amount) || 0); }, 0);
      backdrop.querySelector("#b-oblig-total").textContent = fmt(total);
    }

    renderRows();
    updateTotal();

    backdrop.querySelector("#b-add-row").addEventListener("click", function () {
      obligations.push({ name: "", amount: "" });
      renderRows();
      updateTotal();
    });
    backdrop.addEventListener("click", function (ev) { if (ev.target === backdrop) closeSheet(); });
    backdrop.querySelector("#b-cancel").addEventListener("click", closeSheet);
    backdrop.querySelector("#b-save").addEventListener("click", function () {
      var income = parseFloat(String(document.getElementById("b-income").value).replace(",", ".")) || 0;
      var cleanObligations = obligations
        .map(function (o) { return { name: (o.name || "").trim(), amount: parseFloat(o.amount) || 0 }; })
        .filter(function (o) { return o.name || o.amount; });
      saveBudgetForCurrentPeriod({ income: income, obligations: cleanObligations });
      closeSheet();
    });
  }

  function openPaydaySheet() {
    var backdrop = document.createElement("div");
    backdrop.className = "sheet-backdrop";
    backdrop.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-handle"></div>' +
        '<h3>Кога започва периодът ти</h3>' +
        '<div class="field"><label>Ден от месеца на заплата</label><input class="amount-input" id="p-day" inputmode="numeric" placeholder="1" value="' + state.payday + '"></div>' +
        '<div class="caption" style="color:var(--ink-faint); font-size:0.82rem;">Напр. 20 означава, че периодът ти тръгва от 20-о число и свършва на 19-о следващия месец. 1 означава обикновен календарен месец.</div>' +
        '<div class="sheet-actions">' +
          '<button class="btn ghost" id="p-cancel">Отказ</button>' +
          '<button class="btn primary" id="p-save">Запази</button>' +
        '</div>' +
        '<div style="border-top:1px solid var(--border); padding-top:14px; display:flex; flex-direction:column; gap:8px;">' +
          '<label style="font-size:0.78rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;">Опасна зона</label>' +
          '<button type="button" class="btn danger" id="p-clear-period" style="flex:none;">Изтрий разходите за ' + formatPeriodLabel(state.periodStart, state.payday) + '</button>' +
        '</div>' +
      '</div>';
    sheetRoot.appendChild(backdrop);
    backdrop.addEventListener("click", function (ev) { if (ev.target === backdrop) closeSheet(); });
    backdrop.querySelector("#p-cancel").addEventListener("click", closeSheet);
    backdrop.querySelector("#p-save").addEventListener("click", function () {
      var day = parseInt(document.getElementById("p-day").value, 10);
      if (!day || day < 1) day = 1;
      if (day > 31) day = 31;
      savePayday(day);
      closeSheet();
    });
    backdrop.querySelector("#p-clear-period").addEventListener("click", function () {
      var label = formatPeriodLabel(state.periodStart, state.payday);
      if (!window.confirm("Сигурен ли си, че искаш да изтриеш всички разходи за " + label + "? Това не може да се отмени.")) return;
      deleteExpensesInCurrentPeriod();
      closeSheet();
    });
  }

  document.getElementById("fabAdd").addEventListener("click", function () { openExpenseSheet(null); });
  document.getElementById("addCatBtn").addEventListener("click", function () { openCategorySheet(null); });
  document.getElementById("editBudgetLink").addEventListener("click", openBudgetSheet);
  document.getElementById("paydayBtn").addEventListener("click", openPaydaySheet);

  // ---------- Init ----------
  function init() {
    state.categories = loadLS(LS.categories, []);
    state.expenses = loadLS(LS.expenses, []);
    state.budgets = loadLS(LS.budgets, {});
    var settings = loadLS(LS.settings, { payday: 1 });
    state.payday = settings.payday || 1;
    state.periodStart = periodStartForDate(new Date(), state.payday);

    if (!state.categories.length) {
      state.categories = DEFAULT_CATEGORIES.map(function (c, i) {
        return Object.assign({ id: uid(), order: i }, c);
      });
      saveLS(LS.categories, state.categories);
    }

    loadBudgetForPeriod();
    render();
  }

  init();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
